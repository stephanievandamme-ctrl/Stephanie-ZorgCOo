<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digitale cijfermachine D H T E</title><style>
:root{font-family:Arial,system-ui,sans-serif;color:#193047;background:#f5f8fb}*{box-sizing:border-box}body{margin:0}.app{max-width:1100px;margin:auto;padding:22px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(23px,3vw,38px);margin:12px 0}.machine{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(7px,2vw,22px);margin:26px 0}.place{text-align:center;min-width:0}.place h2{font-size:clamp(30px,5vw,62px);margin:0 0 12px;color:var(--c)}.unit{border:4px solid var(--c);border-radius:20px;background:var(--bg);padding:clamp(7px,2vw,20px);display:flex;flex-direction:column;align-items:center;gap:10px}.digit{font-size:clamp(66px,13vw,160px);font-weight:700;line-height:1.2;color:var(--c);font-variant-numeric:tabular-nums}.arrow{width:100%;min-height:60px;border:2px solid var(--c);border-radius:14px;background:white;color:var(--c);font-size:clamp(32px,5vw,58px);font-weight:bold;cursor:pointer;touch-action:manipulation}.arrow:hover,.arrow:focus-visible{background:var(--c);color:white}.arrow:active{transform:scale(.96)}.digit.changed{animation:flash 1.1s ease-out}@keyframes flash{0%,45%{background:#ffe48a;transform:scale(1.09);border-radius:12px}100%{background:transparent;transform:scale(1)}}.result{background:white;border:2px solid #d8e2eb;border-radius:18px;padding:15px;text-align:center}.result .label{font-size:18px}.number{font-size:clamp(42px,7vw,82px);font-weight:700;letter-spacing:.07em}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}.action{background:#214b78;color:white;border:0;border-radius:12px;padding:15px 20px;font-size:18px;font-weight:bold;cursor:pointer}.action.secondary{background:#e5edf5;color:#173d65}.hint{text-align:center;color:#526679;font-size:15px;margin-top:18px}@media(max-width:500px){.app{padding:10px}.machine{gap:5px}.unit{border-width:2px;border-radius:10px;padding:5px;gap:5px}.arrow{min-height:48px;border-radius:7px}.place h2{margin-bottom:6px}.digit{font-size:clamp(48px,14vw,75px)}.action{font-size:15px;padding:12px}}@media print{.actions,.hint,.arrow,header button{display:none}.unit{min-height:160px;justify-content:center}}
</style></head><body><main class="app"><header><h1>Mijn cijfermachine</h1><button class="action secondary" id="full">⛶ Volledig scherm</button></header><section class="machine" aria-label="Vier plaatswaarden"><div class="place" style="--c:#d44747;--bg:#fff0f0"><h2>D</h2><div class="unit"><button class="arrow" data-index="0" data-step="1" aria-label="Duizendtallen verhogen">⌃</button><div class="digit" id="d0">7</div><button class="arrow" data-index="0" data-step="-1" aria-label="Duizendtallen verlagen">⌄</button></div></div><div class="place" style="--c:#287ac8;--bg:#eaf4ff"><h2>H</h2><div class="unit"><button class="arrow" data-index="1" data-step="1" aria-label="Honderdtallen verhogen">⌃</button><div class="digit" id="d1">6</div><button class="arrow" data-index="1" data-step="-1" aria-label="Honderdtallen verlagen">⌄</button></div></div><div class="place" style="--c:#198c53;--bg:#e8f8ee"><h2>T</h2><div class="unit"><button class="arrow" data-index="2" data-step="1" aria-label="Tientallen verhogen">⌃</button><div class="digit" id="d2">3</div><button class="arrow" data-index="2" data-step="-1" aria-label="Tientallen verlagen">⌄</button></div></div><div class="place" style="--c:#b58400;--bg:#fff7d8"><h2>E</h2><div class="unit"><button class="arrow" data-index="3" data-step="1" aria-label="Eenheden verhogen">⌃</button><div class="digit" id="d3">1</div><button class="arrow" data-index="3" data-step="-1" aria-label="Eenheden verlagen">⌄</button></div></div></section><section class="result" aria-live="polite"><div class="label">Mijn getal</div><div class="number" id="number">7.631</div></section><div class="actions"><button class="action secondary" id="clear">↺ Wis</button><button class="action secondary" id="restore">Voorbeeld herstellen</button><button class="action" id="random">⚄ Nieuw getal</button></div><p class="hint">De cijfermachine wisselt automatisch in: 10 eenheden = 1 tiental, 10 tientallen = 1 honderdtal. Bij 0 wisselt ze ook terug. Bereik: 0000 tot 9999. Werkt zonder internet.</p></main><script>
let digits=[7,6,3,1];
function draw(previous){
 digits.forEach((n,i)=>{
  const el=document.getElementById('d'+i);
  el.textContent=n;
  el.classList.remove('changed');
  if(previous && previous[i]!==n){void el.offsetWidth;el.classList.add('changed')}
 });
 document.getElementById('number').textContent=Number(digits.join('')).toLocaleString('nl-BE');
}
function change(index,step){
 const previous=[...digits];
 const value=Number(digits.join(''));
 const place=Math.pow(10,3-index);
 const next=value+step*place;
 if(next<0||next>9999)return;
 digits=String(next).padStart(4,'0').split('').map(Number);
 draw(previous);
}
document.querySelectorAll('[data-index]').forEach(b=>b.addEventListener('click',()=>change(Number(b.dataset.index),Number(b.dataset.step))));
document.getElementById('clear').onclick=()=>{digits=[0,0,0,0];draw()};document.getElementById('restore').onclick=()=>{digits=[7,6,3,1];draw()};document.getElementById('random').onclick=()=>{digits=digits.map(()=>Math.floor(Math.random()*10));draw()};document.getElementById('full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.()}else{document.exitFullscreen?.()}};draw();
</script></body></html>
